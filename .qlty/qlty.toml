config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/.claude/**",
  # Symlink to lambda/types.ts, jsii needs the file in lib/
  "lib/types.ts",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "block"

[[source]]
name = "default"
default = true

[[plugin]]
name = "radarlint-js"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "trivy"

[[plugin]]
name = "gitleaks"

[[plugin]]
name = "trufflehog"

# The AWS SDK types these response fields as optional, the strict tsconfig of
# the Lambda (lambda/tsconfig.json) requires the non-null assertions.
# radarlint doesn't see that config and reports them as unnecessary.
[[triage]]
match.rules = ["radarlint-js:typescript:S4325"]
match.file_patterns = ["lambda/index.ts", "lambda/key-pair.ts", "lambda/secrets.ts"]
set.ignored = true

# CDK pattern: the stack registers itself in the app, the instance isn't used.
[[triage]]
match.rules = ["radarlint-js:typescript:S1848"]
match.file_patterns = ["test/bin/test.ts"]
set.ignored = true

# minimatch 10.x is bundled in aws-cdk-lib (bundleDependencies), so npm
# overrides can't replace it. aws-cdk-lib is only a dev and peer dependency,
# users of the construct bring their own.
[[triage]]
match.rules = ["osv-scanner:CVE-2026-118764"]
match.file_patterns = ["package-lock.json"]
set.ignored = true
