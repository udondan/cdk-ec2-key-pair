---
name: Dependency Submission

# GitHub's dependency graph doesn't read bun.lock, so Dependabot only alerts on
# the direct dependencies in the package.json files. This submits every locked
# package of bun.lock and lambda/bun.lock, transitive ones included, after each
# change on main. GitHub then checks them against new advisories by itself, so
# no scheduled scan is needed, and the alerts never block a pull request.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/bun.lock"
      - "**/package.json"
      - .github/workflows/dependency-submission.yml

permissions:
  contents: read

concurrency:
  group: dependency-submission
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # dependency submission API
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: charpeni/bun-lock-submission@a03085a531255ea928590ac0d76d53383a026bdf # v1.0.0
