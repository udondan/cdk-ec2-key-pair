---
name: Publish packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false # no cache restored from another run in the publish job

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          make install
          sudo apt-get update
          sudo apt-get install -y tree jq

      - name: Build source w/ jsii
        run: |
          lambda/build
          npx jsii
          make validate-package

      - name: Build packages w/ jsii-pacmak
        run: |
          npx jsii-pacmak --verbose
          tree dist

      - name: Publish to npm
        run: npx publib-npm
        env:
          NPM_TRUSTED_PUBLISHER: "true"
          NPM_CONFIG_PROVENANCE: "true"

      - name: Publish to PyPI
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES=1
          npx publib-pypi
        env:
          PYPI_TRUSTED_PUBLISHER: "true"

      - name: Publish to NuGet
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES=1
          npx publib-nuget
        env:
          NUGET_TRUSTED_PUBLISHER: "true"
          NUGET_USERNAME: udondan
