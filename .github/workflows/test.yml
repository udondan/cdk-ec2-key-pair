---
name: Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Codecov compares pull requests against the coverage of main.
  push:
    branches:
      - main

jobs:
  # Only one run at a time may use the AWS test account.
  boarding-gate:
    name: Queue
    # On push to main only the unit tests run, for the coverage report of main.
    if: github.event_name != 'push'
    permissions:
      actions: read
      contents: write # lock refs under refs/boarding-gate/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    # Queue order, the concurrency group that cancels outdated waiting runs and
    # the rebase of branches that are behind main: see
    # https://github.com/udondan/boarding-gate#reusable-workflow
    # The rebase needs OVERRIDE_TOKEN: pushes with github.token don't start new runs.
    uses: udondan/boarding-gate/.github/workflows/boarding-gate.yml@v1
    secrets:
      update-token: ${{ secrets.OVERRIDE_TOKEN }}

  # Unit tests and the AWS test only run if code or build config changed.
  # Skipped outside of pull requests, so pushes to main and workflow_dispatch
  # always run them. Waits for boarding-gate like everything else: while
  # another run holds the turn, this one likely needs a rebase anyway.
  changes:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files via the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - lib/**
              - lambda/**
              - test/**
              - tests/**
              - package.json
              - bun.lock
              - mise.toml
              - Makefile
              - tsconfig*.json
              - eslint.config.js
              - .prettierrc
              - .npmignore
              - vitest.config.mts
              - codecov.yml
              - .github/workflows/test.yml

  test:
    needs: [boarding-gate, unit]
    # A skipped job counts as passed for required checks. Run the job even if
    # boarding-gate failed and fail it in the first step. Only run it if the
    # unit tests passed: they are skipped if no code changed, and if they
    # failed, the required job fails on their result.
    if: ${{ !cancelled() && github.event_name != 'push' && needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for assuming the AWS role
      contents: read # checkout

    defaults:
      run:
        shell: bash

    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # lambda/build takes the time of the last commit of the Lambda

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: node bun # versions from mise.toml

      # The root package and the CDK app in test/ share one bun.lock
      - name: Install dependencies
        run: |
          set -euo pipefail
          make install
          sudo apt-get update
          sudo apt-get install -y tree

      - name: Linting
        run: make eslint

      - name: Set Build Permissions
        run: |
          set -euo pipefail
          mkdir "$GITHUB_WORKSPACE/test/cdk.out"
          chmod 777 "$GITHUB_WORKSPACE/test/cdk.out" --recursive
          chmod 777 "$GITHUB_WORKSPACE/lambda" --recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy & Destroy
        run: |
          set -euo pipefail

          # The backticks are a JMESPath literal, not a shell expansion.
          # shellcheck disable=SC2016
          function get_secret_values() {
            AWS_REGION=us-east-1 aws secretsmanager describe-secret \
              --secret-id ec2-ssh-key/CFN-signing-key/private \
              --query 'Tags[?Key==`Test`].Value' --output text
          }

          cd test
          make deploy get-secret-values
          if [ "$(get_secret_values)" != "default" ]; then
            echo "Unexpected secret value"
            exit 1
          fi

          TAG_VALUE=working make deploy
          if [ "$(get_secret_values)" != "working" ]; then
            echo "Unexpected secret value"
            exit 1
          fi

          make DESTROY

      - name: Build source w/ jsii
        run: |
          set -euo pipefail
          lambda/build
          bunx jsii
          make validate-package

      - name: Build packages w/ jsii-pacmak
        id: pacmak
        run: |
          set -euo pipefail
          bunx jsii-pacmak --verbose
          tree dist
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # A prerelease that is never published: the build fails for a version the live site serves
      # with other content, which the version in package.json is between releases
      - name: Build Go module zip
        uses: udondan/goproxy-gh-pages/pack@1bc5f4391f581dea5e41a9b64238111425605a74 # v1
        with:
          module-dir: dist/go/cdkec2keypair
          version: ${{ steps.pacmak.outputs.version }}-test
          output: dist/go-module/{name}-go-module-{version}.zip

      # Only the zip of this build; the live site is read to check that no published version changes
      - name: Build Go module proxy
        uses: udondan/goproxy-gh-pages/build@1bc5f4391f581dea5e41a9b64238111425605a74 # v1
        with:
          output: dist/go-proxy
          base-url: https://udondan.github.io/cdk-ec2-key-pair
          zips: dist/go-module/*.zip
          release-assets: ""
          mirror: false
          fallback-proxy: ""
          verify-sumdb: false

  # Unit tests with coverage. The AWS test only runs if they pass. Also runs on
  # push to main, for the coverage report of main.
  unit:
    name: Unit tests
    needs: [boarding-gate, changes]
    # Skip if no code changed. Otherwise fail instead of skip if boarding-gate
    # failed, see the test job.
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      # boarding-gate is skipped on push to main
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: node bun # versions from mise.toml

      # Without the CDK app in test/
      - name: Install dependencies
        run: make install-root

      - name: Test
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info
          disable_search: true

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It passes with a warning if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [boarding-gate, unit]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.unit.result == 'success' }}
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1

      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  actions:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # Code smells (complexity, duplication, nesting) via Qlty. Git-aware: only
  # smells introduced by the PR compared to main fail the job.
  qlty:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # boarding-gate is skipped on push to main
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@0ff2178667bf8eb28ed0013a7ef54857a24d4056 # v2.7.0

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [boarding-gate, changes, test, unit, coverage, actions, qlty]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
