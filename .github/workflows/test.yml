---
name: Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Codecov compares pull requests against the coverage of main.
  push:
    branches:
      - main

jobs:
  # Only one run at a time may use the AWS test account.
  boarding-gate:
    # On push to main only the unit tests run, for the coverage report of main.
    if: github.event_name != 'push'
    permissions:
      actions: read
      contents: write # lock refs under refs/boarding-gate/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    # Queue order, the concurrency group that cancels outdated waiting runs and
    # the rebase of branches that are behind main: see
    # https://github.com/udondan/boarding-gate#reusable-workflow
    # The rebase needs OVERRIDE_TOKEN: pushes with github.token don't start new runs.
    uses: udondan/boarding-gate/.github/workflows/boarding-gate.yml@v1
    secrets:
      update-token: ${{ secrets.OVERRIDE_TOKEN }}

  test:
    needs: boarding-gate
    # A skipped job counts as passed for required checks. Run the job even if
    # boarding-gate failed and fail it in the first step.
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for assuming the AWS role
      contents: read # checkout

    defaults:
      run:
        shell: bash

    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          path: .npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          make install
          (cd test && make install)
          sudo apt-get update
          sudo apt-get install -y tree

      - name: Linting
        run: make eslint

      - name: Set Build Permissions
        run: |
          set -euo pipefail
          mkdir "$GITHUB_WORKSPACE/test/cdk.out"
          chmod 777 "$GITHUB_WORKSPACE/test/cdk.out" --recursive
          chmod 777 "$GITHUB_WORKSPACE/lambda" --recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy & Destroy
        run: |
          set -euo pipefail

          # The backticks are a JMESPath literal, not a shell expansion.
          # shellcheck disable=SC2016
          function get_secret_values() {
            AWS_REGION=us-east-1 aws secretsmanager describe-secret \
              --secret-id ec2-ssh-key/CFN-signing-key/private \
              --query 'Tags[?Key==`Test`].Value' --output text
          }

          cd test
          make deploy get-secret-values
          if [ "$(get_secret_values)" != "default" ]; then
            echo "Unexpected secret value"
            exit 1
          fi

          TAG_VALUE=working make deploy
          if [ "$(get_secret_values)" != "working" ]; then
            echo "Unexpected secret value"
            exit 1
          fi

          make DESTROY

      - name: Build source w/ jsii
        run: |
          lambda/build
          npx jsii
          make validate-package

      - name: Build packages w/ jsii-pacmak
        run: |
          set -euo pipefail
          npx jsii-pacmak --verbose
          tree dist

  # Doesn't wait for the AWS test account.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          path: .npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: make install

      - name: Test
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info
          disable_search: true

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It passes with a warning if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit]
    if: github.event_name == 'pull_request' && needs.unit.result == 'success'
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  # Doesn't wait for the AWS test account.
  actions:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # Code smells (complexity, duplication, nesting) via Qlty. Git-aware: only
  # smells introduced by the PR compared to main fail the job.
  qlty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [boarding-gate, test, unit, coverage, actions, qlty]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
